[tool.pytest.ini_options]
# Boot Django with these settings first; without this the suite won't start at all.
DJANGO_SETTINGS_MODULE = "settings"
# Where the tests live, so a bare `pytest` finds them.
testpaths = ["apps"]
# The default suite excludes the real-data lane; `just test-dump` passes
# `-m dump` which overrides this (the later -m wins).
addopts = "-m 'not dump'"
markers = [
    "dump: real-data verification tests, run via `just test-dump` against the committed dump subset fixture (roadmap A4).",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
# Start from ruff's defaults (pyflakes + a pycodestyle subset) and tighten
# over time.
select = ["E4", "E7", "E9", "F", "W"]
# Baseline of pre-existing findings, to be ratcheted down. F401 needs a
# manual pass since imports can register signals or template tags.
ignore = ["F401", "E711", "E722", "E731", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
# Package modules re-exporting for their app's public interface.
"**/__init__.py" = ["F401"]
# settings_local overrides via star import by design.
"settings.py" = ["F403", "F405"]
"apps/voting/admin.py" = ["F403", "F405"]
# Pre-existing undefined name, needs a look.
"scripts/name_value.py" = ["F821"]
